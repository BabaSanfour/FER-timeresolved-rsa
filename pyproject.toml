[project]
name = "fer-rsa"
version = "1.0.0"
description = "Time-resolved RSA between EEG and vision models for dynamic facial expressions (NeurIPS 2026)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Analysis (CPU); minimum versions are those the results were computed with.
dependencies = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "scikit-learn>=1.8.0",
    "pandas>=3.0.0",
    "statsmodels>=0.14.6",
    "matplotlib>=3.11.1",
    "h5py>=3.16.0",
    "pillow>=12.3.0",
    "av>=16.1.0",             # stimulus frames (Fig. 1, extraction)
    "mne>=1.9.0",             # EEG channel interpolation, scalp maps
]

[project.optional-dependencies]
# Training and RDM extraction (GPU); also facenet-pytorch (--no-deps) and OpenCV, see README.
models = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "einops>=0.8.2",
    "timm>=1.0.24",
    "transformers>=5.14.1",
    "accelerate>=1.14.0",     # transformers device_map="auto" (Qwen3-VL)
    "qwen-vl-utils>=0.0.14",
    "tqdm",
    "requests",
]
# Training M3DFEL on DFEW (M3DFEL/main.py; not rerun, DFEW requires a licence).
dfew = ["seaborn>=0.13.2"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fer_rsa*"]

[tool.setuptools.package-data]
"fer_rsa.eeg" = ["roi_definitions.json"]
